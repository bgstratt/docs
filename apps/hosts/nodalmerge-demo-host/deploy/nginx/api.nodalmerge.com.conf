# nginx config fronting nodalmerge-demo-host on api.nodalmerge.com.
#
# Assumes TLS termination via certbot is already set up for this server_name
# (existing nginx/certbot setup) — this file focuses on the reverse-proxy and
# guardrail directives layered on top. See ../../../../../plans/demo-host-public-deploy-guardrails.md
# for the reasoning behind each limit.
#
# --- add once, in the main `http {}` block alongside existing zones ---
# limit_conn_zone $binary_remote_addr zone=nm_perip:10m;
# limit_conn_zone $uri                zone=nm_perroom:10m;
# limit_req_zone  $binary_remote_addr zone=nm_httpreq:10m rate=5r/s;

upstream nodalmerge_demo_host {
    server 127.0.0.1:5074;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.nodalmerge.com;

    ssl_certificate /etc/letsencrypt/live/api.nodalmerge.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.nodalmerge.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
    # WebSocket sync runtime — /ws/runtime and /ws/{roomId}
    location /ws/ {
        proxy_pass http://nodalmerge_demo_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle timeout: drop a connection with no traffic either direction for 15m.
        # Active sessions keep sending frames and never hit this.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Per-IP concurrent connection cap (all rooms combined).
        limit_conn nm_perip 30;
        # Per-room concurrent connection cap ($uri includes the room slug here).
        limit_conn nm_perroom 50;

        # Throttle sustained throughput per connection so a single flooding
        # connection grows host memory slowly instead of instantly.
        limit_rate 131072;       # ~128 KB/s
        limit_rate_after 65536;  # allow a small burst before throttling kicks in
    }

    # Plain HTTP endpoints: health, providers, sync/token(/validate), sync/blob-url
    location / {
        proxy_pass http://nodalmerge_demo_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 16k;  # these are small JSON payloads only
        limit_req zone=nm_httpreq burst=10 nodelay;
    }
}
